# GitHub Pages serves the gh-pages branch; this workflow keeps it in sync
# with main. The extra pages/id-token permissions are inherited by the
# pages-build-deployment run that GitHub spawns after the push.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Push main to gh-pages
        run: git push origin HEAD:gh-pages --force
